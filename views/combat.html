        <!-- Barra de Habilidad FÍSICA (Minijuego Determinista) -->
        <div id="cb-minigame-zone" class="w-full max-w-3xl relative h-12 md:h-14 bg-gray-100 rounded-full overflow-hidden border border-gray-300 shadow-inner hidden mt-2">

<script>
window.combatApp = {
    active: false,
    phase: 'SETUP', 
    playerTeam: [],
    enemyTeam: [],
    turn: 1,
    energy: 3,        // Inicia con 3 de Energía
    maxEnergy: 10,
    selectedSkill: null, // Habilidad encolada como carta
    attacker: null,
    target: null,
    bar: { req: null, x: 0, dir: 1, speed: 1.8, safeStart: 0, safeWidth: 0 },

    // Diccionario de Cartas/Habilidades Fijas (Cero Azar)
    SKILLS_DICT: {
        'flower_wheat': [
            {name: 'Latigazo Rápido', cost: 1, dmg: 40, diff: 40, icon: '🌿'}, 
            {name: 'Tormenta de Trigo', cost: 2, dmg: 80, diff: 25, icon: '🌪️'}
        ],
        'flower_cactus': [
            {name: 'Disparo Espina', cost: 1, dmg: 35, diff: 40, icon: '🌵'}, 
            {name: 'Golpe Pesado', cost: 2, dmg: 75, diff: 25, icon: '💥'}
        ],
        'flower_bamboo': [
            {name: 'Corte Ágil', cost: 1, dmg: 45, diff: 35, icon: '🎋'}, 
            {name: 'Estocada Feroz', cost: 3, dmg: 120, diff: 15, icon: '⚔️'}
        ],
        'flower_crystal': [
            {name: 'Reflejo Solar', cost: 1, dmg: 50, diff: 35, icon: '💎'}, 
            {name: 'Rayo Prismático', cost: 3, dmg: 130, diff: 15, icon: '✨'}
        ],
        'flower_moon': [
            {name: 'Polvo Estelar', cost: 1, dmg: 40, diff: 40, icon: '🌙'}, 
            {name: 'Eclipse Total', cost: 2, dmg: 85, diff: 20, icon: '🌑'}
        ],
        'default': [
            {name: 'Embestida', cost: 1, dmg: 30, diff: 40, icon: '🍃'}, 
            {name: 'Golpe Mayor', cost: 2, dmg: 65, diff: 25, icon: '🔥'}
        ]
    },

    init() {
        if (!window.farmApp) { loadView('farm'); return; }

        // 1. Cobrar Ticket de Ingreso
        if (window.farmApp.state.inventory['tool_duel_ticket'] && window.farmApp.state.inventory['tool_duel_ticket'].qty > 0) {
            window.farmApp.state.inventory['tool_duel_ticket'].qty -= 1;
            window.farmApp.updateInventoryUI();
        }

        this.playerTeam = [];
        const selected = window.farmApp.state.selectedCombatants || [];
        
        const buildPlant = (pid, name, icon, isArsenal, idTag) => {
            let pDef = 20, pHp = 100;
            if(pid === 'flower_wheat') { pDef = 15; pHp = 100; }
            else if(pid === 'flower_cactus') { pDef = 35; pHp = 150; } 
            else if(pid === 'flower_bamboo') { pDef = 20; pHp = 100; }
            else if(pid === 'flower_crystal') { pDef = 8; pHp = 60; } 
            else if(pid === 'flower_moon') { pDef = 25; pHp = 200; } 

            const skills = this.SKILLS_DICT[pid] || this.SKILLS_DICT['default'];

            this.playerTeam.push({ 
                fromArsenal: isArsenal, 
                arsId: isArsenal ? idTag : null,
                plotId: !isArsenal ? idTag : null,
                name: name, icon: icon, hp: pHp, maxHp: pHp, def: pDef,
                skills: skills // Vinculamos las habilidades (cartas)
            });
        };

        // 2. Procesar selección de Granja/Arsenal
        selected.forEach(sel => {
            if (sel.type === 'arsenal') {
                const ap = window.farmApp.state.arsenal.find(a => a.id === sel.idTag);
                if (ap) buildPlant(ap.plantId, ap.name, ap.icon, true, ap.id);
            } else if (sel.type === 'plot') {
                const p = window.farmApp.state.plots.find(plot => plot.id == sel.idTag);
                if (p && p.plant) buildPlant(p.plant.id, p.plant.name, p.plant.icon, false, p.id);
            }
        });

        // 3. Fallback en caso de recargar forzada
        if (this.playerTeam.length === 0) {
            let storedArsenal = window.farmApp.state.arsenal || [];
            storedArsenal.slice(0, 3).forEach(ap => buildPlant(ap.plantId, ap.name, ap.icon, true, ap.id));
        }

        // 4. Armar Enemigos (Cuervos de Coljuegos - Cero Azar)
        this.enemyTeam = [
            { name: 'Cuervo Rastrero', icon: window.farmApp.state.images.crow, hp: 100, maxHp: 100, atk: 30 },
            { name: 'Cuervo Alfa', icon: window.farmApp.state.images.crow, hp: 180, maxHp: 180, atk: 45 },
            { name: 'Cuervo Rastrero', icon: window.farmApp.state.images.crow, hp: 100, maxHp: 100, atk: 30 }
        ];

        window.farmApp.state.combatLock = true; // Activar Escudo para la Granja
        this.active = true;
        this.turn = 1;
        this.energy = 3;
        this.phase = 'P_SELECT';
        this.updateUI();
        this.updateEnergyUI();
        this.setInstruction('TU TURNO: Elige con qué planta atacar 👇');
    },

    updateEnergyUI() {
        document.getElementById('cb-energy-counter').innerText = `${this.energy} / ${this.maxEnergy}`;
    },

    selectEntity(team, index) {
        if (this.phase === 'P_SELECT') {
            if (team === 'player' && this.playerTeam[index].hp > 0) {
                this.attacker = this.playerTeam[index];
                this.setInstruction(`Planta lista: ${this.attacker.name} | Elige una Carta de Acción 👇`);
                this.showSkillsPanel();
            }
        } else if (this.phase === 'P_TARGETING') {
            if (team === 'enemy' && this.enemyTeam[index].hp > 0) {
                this.target = this.enemyTeam[index];
                this.phase = 'P_MINIGAME';
                
                // Consumir energía y ocultar cartas
                this.energy -= this.selectedSkill.cost;
                this.updateEnergyUI();
                document.getElementById('cb-skills-panel').classList.add('hidden');
                
                // La dificultad (ancho de la zona azul) es fija por cada carta
                this.startMinigame(this.selectedSkill.diff, `EJECUTAR ${this.selectedSkill.name.toUpperCase()}`);
            }
        }
        this.updateUI();
    },

    showSkillsPanel() {
        const panel = document.getElementById('cb-skills-panel');
        panel.innerHTML = '';
        
        this.attacker.skills.forEach((skill, idx) => {
            const canAfford = this.energy >= skill.cost;
            const btnClass = canAfford 
                ? 'bg-white border border-gray-200 cursor-pointer shadow-sm hover:border-cg_blue hover:shadow-md skill-card' 
                : 'bg-gray-100 border border-gray-200 opacity-50 cursor-not-allowed grayscale';
            
            panel.innerHTML += `
                <button ${canAfford ? `onclick="window.combatApp.selectSkill(${idx})"` : 'disabled'} class="w-full text-left p-3 sm:p-4 rounded-2xl flex flex-col justify-between ${btnClass}">
                    <div class="flex justify-between items-start mb-2 w-full">
                        <span class="text-[10px] md:text-xs font-black uppercase bg-blue-50 text-blue-600 px-2 py-1 rounded-lg tracking-widest border border-blue-100 flex items-center gap-1 shrink-0">
                            ⚡ ${skill.cost}
                        </span>
                        <span class="text-xl md:text-2xl shrink-0 opacity-80">${skill.icon}</span>
                    </div>
                    <div class="w-full">
                        <span class="font-black text-cg_navy text-sm md:text-base leading-tight block truncate">${skill.name}</span>
                        <span class="text-[11px] md:text-xs font-bold text-red-500 mt-0.5 block">Daño Fijo: ${skill.dmg}</span>
                    </div>
                </button>
            `;
        });
        panel.classList.remove('hidden');
    },

    selectSkill(skillIdx) {
        const skill = this.attacker.skills[skillIdx];
        if (this.energy >= skill.cost) {
            this.selectedSkill = skill;
            this.phase = 'P_TARGETING';
            this.setInstruction(`Carta Jugada: ${skill.name} | Toca a un Cuervo Objetivo 🎯`);
            this.updateUI();
        }
    },

    startMinigame(safeWidthPct, btnText) {
        this.setInstruction('¡PREPARA TU REFLEJO!');
        const mgZone = document.getElementById('cb-minigame-zone');
        const safeZone = document.getElementById('cb-safe-zone');
        const btn = document.getElementById('cb-action-btn');
        
        mgZone.classList.remove('hidden');
        btn.classList.remove('hidden');
        btn.innerText = btnText;

        // FÓRMULA DETERMINISTA (Coljuegos Safe - Cero Azar)
        // Posición calculada basada en el turno, vida del enemigo y energía. Jamás usa Math.random().
        let pseudoRandomSeed = (this.turn * 13 + this.energy * 7 + (this.target ? Math.floor(this.target.hp) : 100)) % 100;
        this.bar.safeWidth = Math.max(15, Math.min(60, safeWidthPct)); // Limites de la carta
        this.bar.safeStart = (pseudoRandomSeed / 100) * (100 - this.bar.safeWidth);
        
        safeZone.style.width = `${this.bar.safeWidth}%`;
        safeZone.style.left = `${this.bar.safeStart}%`;

        this.bar.x = 0;
        this.bar.dir = 1;

        const tick = () => {
            this.bar.x += this.bar.dir * this.bar.speed;
            if(this.bar.x >= 100) { this.bar.x = 100; this.bar.dir = -1; }
            if(this.bar.x <= 0) { this.bar.x = 0; this.bar.dir = 1; }
            document.getElementById('cb-pointer').style.left = `${this.bar.x}%`;
            this.bar.req = requestAnimationFrame(tick);
        };
        this.bar.req = requestAnimationFrame(tick);
    },

    stopMinigame() {
        cancelAnimationFrame(this.bar.req);
        document.getElementById('cb-minigame-zone').classList.add('hidden');
        document.getElementById('cb-action-btn').classList.add('hidden');

        const hitX = this.bar.x;
        const center = this.bar.safeStart + (this.bar.safeWidth / 2);
        
        const isHit = hitX >= this.bar.safeStart && hitX <= (this.bar.safeStart + this.bar.safeWidth);
        const isCrit = Math.abs(hitX - center) <= (this.bar.safeWidth * 0.15); // Crítico central estricto (15% del centro de la zona azul)

        if (this.phase === 'P_MINIGAME') {
            const baseDmg = this.selectedSkill.dmg;
            if (isCrit) {
                this.showFx("¡PERFECTO!", "text-yellow-400");
                this.target.hp -= baseDmg; 
            } else if (isHit) {
                this.showFx("¡GOLPE DEBIL!", "text-green-500");
                this.target.hp -= Math.floor(baseDmg * 0.6); // 60% de daño si no dio en el centro exacto
            } else {
                this.showFx("¡FALLASTE!", "text-gray-400");
            }
            this.bar.speed = 1.8; // Resetear velocidad
            setTimeout(() => this.checkWinLoss('ENEMY'), 1200);
        } 
        else if (this.phase === 'E_MINIGAME') {
            if (isCrit) {
                this.showFx("¡BLOQUEO TOTAL!", "text-blue-500");
                // 100% de daño evadido
            } else if (isHit) {
                this.showFx("¡DEFENSA PARCIAL!", "text-orange-500");
                this.target.hp -= Math.floor(this.attacker.atk * 0.5); // Mitiga el 50%
            } else {
                this.showFx("¡IMPACTO DIRECTO!", "text-red-600");
                this.target.hp -= Math.floor(this.attacker.atk * 1.2); // Castigo: Recibe 20% más
            }
            this.bar.speed = 1.8; // Resetear velocidad
            setTimeout(() => this.checkWinLoss('PLAYER'), 1200);
        }
        this.updateUI();
    },

    checkWinLoss(nextTurn) {
        const pAlive = this.playerTeam.filter(p => p.hp > 0);
        const eAlive = this.enemyTeam.filter(e => e.hp > 0);

        if (eAlive.length === 0) {
            this.endCombat(true); 
        } else if (pAlive.length === 0) {
            this.endCombat(false); 
        } else {
            if (nextTurn === 'ENEMY') {
                this.executeEnemyTurn(pAlive, eAlive);
            } else {
                this.turn++;
                this.energy = Math.min(this.maxEnergy, this.energy + 2); // Restaurar 2 de Energía
                this.updateEnergyUI();
                this.phase = 'P_SELECT';
                this.attacker = null;
                this.target = null;
                this.selectedSkill = null;
                this.setInstruction('TU TURNO: Elige con qué planta atacar 👇');
                this.updateUI();
            }
        }
    },

    executeEnemyTurn(pAlive, eAlive) {
        this.phase = 'E_TURN';
        this.setInstruction('TURNO ENEMIGO...');
        
        // IA Determinista Fija: Ataca cíclicamente al jugador con menos vida
        this.attacker = eAlive[this.turn % eAlive.length] || eAlive[0]; 
        this.target = pAlive.reduce((prev, curr) => (prev.hp < curr.hp ? prev : curr));
        
        this.updateUI();
        
        setTimeout(() => {
            this.phase = 'E_MINIGAME';
            const defZone = this.target.def; // La zona es ESTRICTAMENTE el % de defensa
            this.bar.speed = 2.5; // El enemigo ataca más rápido (Tensión)
            this.startMinigame(defZone, "¡DEFENDER!"); 
        }, 1200);
    },

    endCombat(victory) {
        this.active = false;
        window.farmApp.state.combatLock = false; 

        if (victory) {
            window.farmApp.state.seedsBalance += 25000;
            document.getElementById('combat-victory-modal').classList.remove('hidden');
            document.getElementById('combat-victory-modal').classList.add('flex');
        } else {
            // Eliminar penalización: Limpiamos solo las plantas que se usaron en combate
            this.playerTeam.forEach(pt => {
                if (pt.fromArsenal) {
                    window.farmApp.state.arsenal = window.farmApp.state.arsenal.filter(a => a.id !== pt.arsId);
                } else if (pt.plotId !== undefined) {
                    let plot = window.farmApp.state.plots[pt.plotId];
                    plot.status = 'empty'; 
                    plot.plant = null; 
                    plot.isReady = false; 
                    plot.potUses = Math.max(0, plot.potUses - 1);
                }
            });
            document.getElementById('combat-defeat-modal').classList.remove('hidden');
            document.getElementById('combat-defeat-modal').classList.add('flex');
        }
        
        window.farmApp.saveState();
    },

    updateUI() {
        document.getElementById('cb-turn-counter').innerText = this.turn;

        const renderTeam = (teamArr, containerId, side) => {
            const c = document.getElementById(containerId);
            c.innerHTML = '';
            
            teamArr.forEach((ent, idx) => {
                // Espacio transparente si está muerto
                if (ent.hp <= 0) {
                    c.innerHTML += `<div class="w-[72px] sm:w-24 md:w-32 opacity-0 shrink-0"></div>`;
                    return;
                }
                
                let isActing = (this.attacker === ent) || (this.target === ent);
                
                // Efectos de Selección
                let highlight = isActing 
                    ? (side === 'P' ? 'scale-110 drop-shadow-[0_0_20px_rgba(34,197,94,0.8)] z-20' : 'scale-110 drop-shadow-[0_0_20px_rgba(239,68,68,0.8)] z-20') 
                    : (side === 'P' && this.phase === 'P_SELECT' ? 'hover:scale-105 hover:drop-shadow-xl z-10 cursor-pointer ring-2 ring-transparent hover:ring-cg_blue rounded-full' : (side === 'E' && this.phase === 'P_TARGETING' ? 'hover:scale-105 hover:drop-shadow-xl z-10 cursor-pointer ring-2 ring-transparent hover:ring-red-500 rounded-full animate-pulse' : 'opacity-95'));
                
                // Color de Barra de Vida
                let hpPercent = Math.max(0, (ent.hp / ent.maxHp) * 100);
                let hpColor = hpPercent > 50 ? 'bg-green-500' : (hpPercent > 20 ? 'bg-yellow-400' : 'bg-red-500');

                c.innerHTML += `
                    <div class="flex flex-col items-center relative transition-all duration-300 ${highlight}" ${((side === 'P' && this.phase === 'P_SELECT') || (side === 'E' && this.phase === 'P_TARGETING')) ? `onclick="window.combatApp.selectEntity('${side === 'P' ? 'player' : 'enemy'}',${idx})"` : ''}>
                        
                        <!-- Barra de Vida -->
                        <div class="w-14 sm:w-16 md:w-20 bg-gray-200 h-1.5 md:h-2 rounded-full overflow-hidden mb-2 shadow-inner border border-gray-300">
                             <div class="${hpColor} h-full transition-all duration-300" style="width: ${hpPercent}%"></div>
                        </div>
                        
                        <!-- Contenedor Hexagonal CSS -->
                        <div class="relative w-[72px] h-[84px] sm:w-24 sm:h-28 md:w-32 md:h-36 flex items-center justify-center group animate-float" style="animation-delay: ${idx * 0.2}s">
                            <!-- Sombra base / Borde simulado -->
                            <div class="absolute inset-0 ${side === 'P' ? 'bg-green-400' : 'bg-red-400'} hex-shape opacity-20 group-hover:opacity-40 transition-opacity"></div>
                            
                            <!-- Hexágono Interior Blanco -->
                            <div class="absolute inset-[2px] sm:inset-[3px] bg-white hex-inner flex items-center justify-center overflow-hidden border border-white shadow-inner">
                                <div class="absolute inset-0 bg-gradient-to-b ${side === 'P' ? 'from-green-50 to-white' : 'from-red-50 to-white'} opacity-80"></div>
                                <img src="${ent.icon}" class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain relative z-10 drop-shadow-md ${isActing ? 'animate-pulse' : ''} ${side==='E' ? 'transform scale-x-[-1]' : ''}">
                            </div>
                        </div>
                        
                        <!-- Stats Flotantes -->
                        <div class="absolute -bottom-2 sm:-bottom-3 bg-white px-2 sm:px-3 py-1 sm:py-1.5 rounded-xl shadow-md border border-gray-200 flex gap-1 sm:gap-2 text-[8px] sm:text-[9px] md:text-[10px] font-black uppercase whitespace-nowrap z-30">
                             <span class="text-orange-500 flex items-center gap-0.5" title="Ataque">⚔️ ${ent.atk}</span>
                             ${side === 'P' ? `<span class="text-blue-500 flex items-center gap-0.5" title="Defensa">🛡️ ${ent.def}%</span>` : ''}
                        </div>
                    </div>`;
            });
        };

        renderTeam(this.enemyTeam, 'cb-enemy-team', 'E');
        renderTeam(this.playerTeam, 'cb-player-team', 'P');
    },

    setInstruction(text) {
        document.getElementById('cb-action-text').innerText = text;
    },

    showFx(msg, colorClass) {
        const fx = document.getElementById('cb-fx-msg');
        fx.innerText = msg;
        fx.className = `text-4xl sm:text-5xl md:text-7xl font-black ${colorClass} drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] transition-all duration-300 text-center uppercase tracking-widest transform scale-110`;
        fx.style.opacity = '1';
        
        setTimeout(() => { 
            fx.style.opacity = '0'; 
            fx.classList.replace('scale-110', 'scale-90');
        }, 1000);
    }
};

setTimeout(() => window.combatApp.init(), 150);
</script>
</div>
