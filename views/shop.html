<div class="max-w-[1200px] mx-auto space-y-6 md:space-y-8 animate-fade-in pb-20 relative px-4 md:px-0">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-200/80 pb-5">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <span class="w-2.5 h-2.5 rounded-full bg-cg_blue"></span>
                <span class="text-xs font-extrabold text-cg_blue uppercase tracking-widest">Suministros Agrícolas</span>
            </div>
            <h2 class="text-2xl md:text-3xl font-black text-cg_navy tracking-tight">Mercado de Insumos</h2>
            <p class="text-xs md:text-sm text-gray-500 font-medium mt-1">Equípate con las mejores herramientas para optimizar tu producción de semillas.</p>
        </div>
    </div>

    <!-- TABS DE NAVEGACIÓN -->
    <div class="flex gap-2 md:gap-4 border-b border-gray-200 bg-transparent overflow-x-auto pb-0 hide-scrollbar w-full">
        <button onclick="window.shopApp.switchTab('tools')" id="page-tab-tools" class="pb-3 px-3 md:px-4 text-sm md:text-base font-black text-cg_blue border-b-4 border-cg_blue whitespace-nowrap transition-colors">Herramientas</button>
        <button onclick="window.shopApp.switchTab('flowers')" id="page-tab-flowers" class="pb-3 px-3 md:px-4 text-sm md:text-base font-bold text-gray-400 border-b-4 border-transparent hover:text-cg_navy whitespace-nowrap transition-colors">Semillas y Flores</button>
        <button onclick="window.shopApp.switchTab('iap')" id="page-tab-iap" class="pb-3 px-3 md:px-4 text-sm md:text-base font-black text-green-500 border-b-4 border-transparent hover:text-green-600 whitespace-nowrap transition-colors">Servicios VIP (Pago)</button>
    </div>

    <!-- CONTENEDORES DE CATÁLOGO -->
    <div id="page-content-tools" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6"></div>
    <div id="page-content-flowers" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 hidden"></div>
    <div id="page-content-iap" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 hidden"></div>



    <!-- VENTANA MODAL DE ERROR (FONDOS INSUFICIENTES) -->
    <div id="purchase-error-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-cg_navy/80 backdrop-blur-sm transition-opacity duration-300" onclick="document.getElementById('purchase-error-modal').classList.replace('flex', 'hidden')"></div>
        <div class="bg-white rounded-3xl shadow-2xl w-[95%] max-w-sm relative z-10 p-6 md:p-8 flex flex-col items-center text-center border border-red-500 animate-fade-in">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-red-50 rounded-full border-4 border-red-100 flex items-center justify-center mb-4 md:mb-5 shadow-inner relative">
                <span class="text-3xl md:text-4xl relative z-10 drop-shadow-md">⚠️</span>
            </div>
            <h3 class="text-xl md:text-2xl font-black text-cg_navy mb-1">Saldo Insuficiente</h3>
            <p class="text-xs md:text-sm font-bold text-gray-500 mb-5 md:mb-6">No tienes Semillas (🌱) suficientes para realizar esta compra.</p>
            <button onclick="document.getElementById('purchase-error-modal').classList.replace('flex', 'hidden')" class="w-full bg-gray-100 hover:bg-gray-200 text-cg_navy border border-gray-200 font-black py-3 md:py-3.5 rounded-xl transition-all shadow-sm uppercase tracking-widest text-[10px] md:text-xs">
                Aceptar
            </button>
        </div>
    </div>



    <!-- VENTANA MODAL TEMPORAL DE COMPRA -->
    <div id="purchase-success-modal" class="fixed inset-0 z-[200] hidden items-center justify-center p-4 pointer-events-none">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity duration-300 opacity-0" id="purchase-modal-bg"></div>
        <div class="bg-white rounded-3xl shadow-2xl w-[95%] max-w-sm relative z-10 p-6 md:p-8 flex flex-col items-center text-center transform scale-95 opacity-0 transition-all duration-300 border border-gray-100" id="purchase-modal-card">
            <div class="w-20 h-20 md:w-24 md:h-24 bg-green-50 rounded-full border-4 border-green-100 flex items-center justify-center mb-4 md:mb-5 shadow-inner relative">
                <div class="absolute inset-0 rounded-full border border-green-200 animate-ping opacity-50"></div>
                <img id="purchase-modal-img" src="" class="w-12 h-12 md:w-14 md:h-14 object-contain relative z-10 drop-shadow-md">
            </div>
            <h3 class="text-xl md:text-2xl font-black text-cg_navy mb-1" id="purchase-modal-title">¡Compra Exitosa!</h3>
            <p class="text-xs md:text-sm font-bold text-gray-500 mb-5 md:mb-6" id="purchase-modal-desc"></p>
            <div class="bg-gray-50 border border-gray-200 px-4 md:px-5 py-2.5 rounded-xl flex items-center gap-2 md:gap-3">
                <span class="text-[10px] md:text-xs font-bold text-gray-400 uppercase tracking-widest">Inversión:</span>
                <span class="text-sm md:text-base font-black text-red-500" id="purchase-modal-price"></span>
            </div>
        </div>
    </div>
</div>

<script>
window.shopApp = {
    state: {
        seedsBalance: 35000,
        inventory: {},
        shopQuantities: {}
    },
    
    catalog: {
        tools: [
            { id: 'tool_pot_small', name: 'Maceta Pequeña', image: 'https://i.ibb.co/BHJVfJhr/Frame-739.png', duration: '5 Siembras', usage: '1', desc: 'Soporta flores y trigo.', price: 5000 },
            { id: 'tool_pot_big', name: 'Maceta Grande', image: 'https://i.ibb.co/tw72tZxv/Frame-740.png', duration: '10 Siembras', usage: '1', desc: 'Resiste el ciclo profundo de flores grandes.', price: 15000 },
            { id: 'tool_water', name: 'Regadera', image: 'https://i.ibb.co/qYHq54kh/Frame-741.png', duration: 'Permanente', usage: '10', desc: 'Rellena el agua de tus plantas de forma manual en el minijuego de riego.', price: 500 },
            { id: 'tool_scarecrow', name: 'Espantacuervos', image: 'https://i.ibb.co/pBBDqXXw/Frame-742.png', duration: '24 Horas', usage: '3', desc: 'Protección preventiva contra plagas. Remueve plagas al instante y extrae el exceso de agua.', price: 6000 }
        ],
        flowers: [
            { id: 'flower_wheat', name: 'Trigo Rápido', image: 'https://i.ibb.co/szXSZjs/Frame-753.png', duration: '5 Minutos', usage: '1', desc: 'Recompensa de 1.500 🌱.<br><strong class="text-cg_navy">Rango de riego:</strong> 60% a 100% (Ultra Rápido)<br><strong class="text-red-500">Peligro:</strong> Inundación inmediata y cuervos.', price: 50 },
            { id: 'flower_cactus', name: 'Cactus de Cuarzo', image: 'https://i.ibb.co/5gvFssT4/Frame-758.png', duration: '30 Minutos', usage: '1', desc: 'Recompensa de 3.200 🌱.<br><strong class="text-cg_navy">Rango de riego:</strong> 20% a 80% (Desafiante)<br><strong class="text-red-500">Peligro:</strong> Pudrición instantánea.', price: 800 },
            { id: 'flower_small', name: 'Flor Pequeña', image: 'https://i.ibb.co/mrJyDqV8/Frame-743.png', duration: '1 Hora', usage: '1', desc: 'Recompensa de 4.500 🌱.<br><strong class="text-cg_navy">Rango de riego:</strong> 30% a 90% (Moderado)<br><strong class="text-red-500">Peligro:</strong> Pudrición temporal que detiene el crecimiento.', price: 2000 },
            { id: 'flower_big', name: 'Flor Grande', image: 'https://i.ibb.co/qF9G5qMw/Frame-744.png', duration: '5 Horas', usage: '1', desc: 'Recompensa de 26.000 🌱.<br><strong class="text-cg_navy">Rango de riego:</strong> 50% a 70% (Lento)<br><strong class="text-red-500">Peligro:</strong> Pudrición con 30m extra de castigo.', price: 10000 }
        ],
        iap: [
            { id: 'iap_sp_12h', name: 'Asistente Auto-Riego 12H', image: 'https://i.ibb.co/6JgfKLBk/Frame-752.png', duration: '12 Horas', usage: 'Automatización', desc: 'Herramienta premium para jugadores competitivos. Automatiza el riego al nivel perfecto y ahuyenta plagas por 12 horas.', price_cop: 2000 },
            { id: 'iap_sp_24h', name: 'Asistente Auto-Riego 24H', image: 'https://i.ibb.co/6JgfKLBk/Frame-752.png', duration: '24 Horas', usage: 'Automatización', desc: 'Herramienta premium. Automatiza tu invernadero por un día completo de forma perfecta.', price_cop: 3500 },
            { id: 'iap_sp_7d', name: 'Asistente Pro 7 Días', image: 'https://i.ibb.co/6JgfKLBk/Frame-752.png', duration: '7 Días', usage: 'Automatización', desc: 'Suscripción Semanal Profesional. Maximiza tu eficiencia sin preocuparte por la micro-gestión ni las plagas del cultivo.', price_cop: 15000 }
        ]
    },

    init() {
        if (window.farmApp && window.farmApp.state) {
            this.state.seedsBalance = window.farmApp.state.seedsBalance;
            this.state.inventory = window.farmApp.state.inventory;
        }
        
        document.getElementById('global-seeds-display').innerText = this.state.seedsBalance.toLocaleString() + " 🌱";
        this.switchTab('tools');
    },

    switchTab(tab) {
        ['tools', 'flowers', 'iap'].forEach(t => {
            const tabBtn = document.getElementById(`page-tab-${t}`);
            const contentDiv = document.getElementById(`page-content-${t}`);
            if (t === tab) {
                tabBtn.className = `pb-3 px-3 md:px-4 text-sm md:text-base font-black ${t === 'iap' ? 'text-green-500 border-green-500' : 'text-cg_blue border-cg_blue'} border-b-4 whitespace-nowrap transition-colors`;
                contentDiv.classList.remove('hidden');
            } else {
                tabBtn.className = `pb-3 px-3 md:px-4 text-sm md:text-base font-bold text-gray-400 border-b-4 border-transparent hover:${t === 'iap' ? 'text-green-600' : 'text-cg_navy'} whitespace-nowrap transition-colors`;
                contentDiv.classList.add('hidden');
            }
        });
        
        this.renderShopItems(tab);
    },

    renderShopItems(tab) {
        const container = document.getElementById(`page-content-${tab}`);
        container.innerHTML = '';
        const items = this.catalog[tab];

        items.forEach(item => {
            if (!(item.id in this.state.shopQuantities)) { this.state.shopQuantities[item.id] = 1; }
            const qty = this.state.shopQuantities[item.id];
            
            let currentStock = 0;
            if(this.state.inventory[item.id]) {
                currentStock = this.state.inventory[item.id].qty || 0;
            }
            
            const card = document.createElement('div');
            card.className = 'bg-white rounded-3xl border border-gray-200 overflow-hidden shadow-soft hover:shadow-lg transition-all duration-300 flex flex-col group';
            
            let tag = tab === 'tools' ? 'Herramienta' : (tab === 'flowers' ? 'Semilla' : 'Servicio Premium');
            
            let actionArea = '';
            let stockBadge = '';

            if (tab === 'iap') {
                actionArea = `<button onclick="window.shopApp.buyIAP('${item.id}')" class="w-full bg-green-500 hover:bg-green-600 text-white font-black text-[13px] md:text-sm py-3.5 rounded-xl shadow-sm transition-all transform active:scale-95 flex items-center justify-center gap-2">Adquirir por $${item.price_cop.toLocaleString()} COP</button>`;
            } else {
                stockBadge = `
                    <div class="absolute top-3 right-3 bg-white/90 backdrop-blur border border-gray-200 px-2.5 py-1 rounded-lg shadow-sm z-20 flex flex-col items-center">
                        <span class="text-[8px] md:text-[9px] font-bold text-gray-400 uppercase tracking-widest leading-none">Tienes</span>
                        <span class="text-xs md:text-sm font-black text-cg_navy leading-none mt-0.5">${currentStock}</span>
                    </div>
                `;
                actionArea = `
                    <div class="flex flex-col sm:flex-row items-center gap-2 sm:gap-3 w-full">
                        <div class="flex items-center bg-gray-50 rounded-xl w-full sm:flex-1 border border-gray-200 shadow-inner h-10 md:h-12 overflow-hidden">
                            <button onclick="window.shopApp.changeShopQty('${item.id}', -1, '${tab}')" class="w-10 h-full flex items-center justify-center text-gray-500 font-black hover:bg-gray-200 transition-colors text-lg">-</button>
                            <div class="flex-1 text-center text-sm font-black text-cg_navy">${qty}</div>
                            <button onclick="window.shopApp.changeShopQty('${item.id}', 1, '${tab}')" class="w-10 h-full flex items-center justify-center text-gray-500 font-black hover:bg-gray-200 transition-colors text-lg">+</button>
                        </div>
                        <button onclick="window.shopApp.buyItem('${item.id}', ${item.price}, '${tab}')" class="w-full sm:w-auto bg-cg_blue hover:bg-cg_navy text-white font-black text-xs md:text-sm h-10 md:h-12 px-4 md:px-6 rounded-xl shadow-sm transition-all transform active:scale-95 flex-shrink-0 flex items-center justify-center gap-1">
                            ${(item.price * qty).toLocaleString()} 🌱
                        </button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="bg-gradient-to-b from-gray-50 to-white h-48 md:h-56 flex items-center justify-center p-4 md:p-6 relative shrink-0 border-b border-gray-100">
                    <span class="absolute top-3 left-3 bg-white text-gray-600 text-[9px] md:text-[10px] font-black px-2 md:px-2.5 py-1 rounded-md shadow-sm border border-gray-200 uppercase tracking-wider z-20">${tag}</span>
                    ${stockBadge}
                    <img src="${item.image}" class="h-36 md:h-44 w-auto object-contain drop-shadow-xl transform group-hover:scale-110 transition-transform duration-500 relative z-10">
                </div>
                <div class="p-4 md:p-6 flex flex-col flex-1">
                    <h4 class="font-black text-cg_navy text-base md:text-lg leading-tight mb-3">${item.name}</h4>
                    <div class="flex justify-between items-center text-[9px] md:text-[10px] font-bold text-gray-500 mb-4 bg-gray-50 p-2 md:p-2.5 rounded-lg border border-gray-100">
                        <span class="uppercase flex items-center gap-1">⏳ ${item.duration}</span>
                        <span class="uppercase flex items-center gap-1 font-extrabold text-cg_navy">Usos: ${item.usage}</span>
                    </div>
                    <p class="text-xs md:text-sm text-gray-500 mb-6 leading-relaxed flex-1">${item.desc}</p>
                    <div class="mt-auto pt-4 border-t border-gray-100">
                        ${actionArea}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    },

    changeShopQty(itemId, delta, tab) {
        let current = this.state.shopQuantities[itemId];
        let next = current + delta;
        if (next >= 1 && next <= 99) {
            this.state.shopQuantities[itemId] = next;
            this.renderShopItems(tab);
        }
    },

    buyItem(itemId, unitPrice, tab) {
        const qty = this.state.shopQuantities[itemId];
        const total = unitPrice * qty;
        
        const targetInventory = (window.farmApp && window.farmApp.state) ? window.farmApp.state.inventory : this.state.inventory;

        if (this.state.seedsBalance >= total) {
            this.state.seedsBalance -= total;
            document.getElementById('global-seeds-display').innerText = this.state.seedsBalance.toLocaleString() + " 🌱";
            
            const balEl = document.getElementById('global-seeds-display');
            balEl.classList.add('text-red-500', 'scale-110');
            setTimeout(() => balEl.classList.remove('text-red-500', 'scale-110'), 300);

            if (!targetInventory[itemId]) {
                let catItem = [...this.catalog.tools, ...this.catalog.flowers].find(i => i.id === itemId);
                targetInventory[itemId] = { 
                    name: catItem.name, 
                    type: tab === 'flowers' ? 'seed' : (itemId.includes('pot') ? 'pot' : (itemId.includes('water') ? 'water' : 'defense')), 
                    reqSize: itemId.includes('small') ? 'small' : (itemId.includes('big') ? 'big' : (itemId.includes('wheat') || itemId.includes('cactus') ? 'small' : null)),
                    qty: 0, 
                    image: catItem.image 
                };
            }

            let addedQty = qty;
            if(itemId === 'tool_scarecrow') addedQty = 3 * qty;
            else if (itemId === 'tool_water') addedQty = 10 * qty;

            targetInventory[itemId].qty += addedQty;
            
            this.saveState();
            this.renderShopItems(tab);
            
            if (window.farmApp) {
                window.farmApp.updateInventoryUI();
                if (window.farmApp.state.selectedPlotId !== null) {
                    window.farmApp.selectPlot(window.farmApp.state.selectedPlotId);
                }
            }

            let catItem = [...this.catalog.tools, ...this.catalog.flowers].find(i => i.id === itemId);
            this.showPurchaseModal(catItem.image, catItem.name, addedQty, total);
            
        } else {
            // === BLOQUE MODIFICADO: Llamado a la modal de error ===
            const errorModal = document.getElementById('purchase-error-modal');
            if (errorModal) {
                errorModal.classList.remove('hidden');
                errorModal.classList.add('flex');
            }
        }
    },

    showPurchaseModal(imgUrl, itemName, qty, pricePaid) {
        const modal = document.getElementById('purchase-success-modal');
        const bg = document.getElementById('purchase-modal-bg');
        const card = document.getElementById('purchase-modal-card');
        
        document.getElementById('purchase-modal-img').src = imgUrl;
        document.getElementById('purchase-modal-desc').innerText = `Has adquirido ${qty}x ${itemName} para tu inventario.`;
        document.getElementById('purchase-modal-price').innerText = `-${pricePaid.toLocaleString()} 🌱`;

        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        setTimeout(() => {
            bg.classList.remove('opacity-0');
            card.classList.remove('scale-95', 'opacity-0');
            card.classList.add('scale-100', 'opacity-100');
        }, 10);

        setTimeout(() => {
            bg.classList.add('opacity-0');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }, 1000); 
    },

    async buyIAP(packageId) {
        const username = sessionStorage.getItem('username');
        if (!username) return alert("Debes iniciar sesión para realizar compras.");
        
        try {
            const res = await fetch('/api/store/buy_seeds', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, package_id: packageId })
            });
            const data = await res.json();
            
            if (res.ok) {
                if(window.farmApp) {
                    window.farmApp.state.balance = data.new_balance_cop;
                }
                if(window.syncUserData) window.syncUserData(); 

                if (packageId.startsWith('iap_sp_')) {
                    const hours = packageId === 'iap_sp_12h' ? 12 : (packageId === 'iap_sp_24h' ? 24 : 168);
                    const now = Date.now();
                    
                    if (window.farmApp) {
                        window.farmApp.state.autoWaterEndTime = Math.max(now, window.farmApp.state.autoWaterEndTime || 0) + (hours * 3600000);
                        window.farmApp.updateSprinklerUI();
                        window.farmApp.saveState(); // El guardado se procesa por red a la DB
                    }

                    alert(`¡Compra Exitosa! Asistente activado por ${hours} horas.`);
                }
            } else {
                alert("Error al procesar la compra: " + data.error);
            }
        } catch(e) {
            alert("Error de conexión al procesar la compra.");
        }
    },

    saveState() {
        if (window.farmApp && window.farmApp.state) {
            window.farmApp.state.seedsBalance = this.state.seedsBalance;
            window.farmApp.saveState(); 
        }
    }
};

window.shopApp.init();
</script>
